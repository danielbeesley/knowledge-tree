<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="64" fill="#060c06"/>
  <!-- Trunk -->
  <rect x="240" y="300" width="32" height="120" rx="4" fill="#1B5E20"/>
  <!-- Root lines -->
  <path d="M248 420 Q230 440 210 445" stroke="#1B5E20" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M264 420 Q282 440 302 445" stroke="#1B5E20" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Canopy layers (bottom to top) -->
  <ellipse cx="256" cy="260" rx="110" ry="55" fill="#1B5E20"/>
  <ellipse cx="256" cy="230" rx="95" ry="50" fill="#2E7D32"/>
  <ellipse cx="256" cy="195" rx="78" ry="45" fill="#388E3C"/>
  <ellipse cx="256" cy="160" rx="58" ry="38" fill="#4CAF50"/>
  <!-- Knowledge nodes (small circles on canopy) -->
  <circle cx="210" cy="240" r="6" fill="#81C784" opacity="0.8"/>
  <circle cx="290" cy="230" r="5" fill="#A5D6A7" opacity="0.7"/>
  <circle cx="240" cy="180" r="5" fill="#C8E6C9" opacity="0.8"/>
  <circle cx="275" cy="195" r="4" fill="#81C784" opacity="0.7"/>
  <circle cx="230" cy="210" r="4" fill="#A5D6A7" opacity="0.6"/>
  <circle cx="270" cy="160" r="4" fill="#C8E6C9" opacity="0.7"/>
  <!-- Connecting lines between nodes (knowledge branches) -->
  <line x1="210" y1="240" x2="230" y2="210" stroke="#81C784" stroke-width="1.5" opacity="0.5"/>
  <line x1="230" y1="210" x2="240" y2="180" stroke="#A5D6A7" stroke-width="1.5" opacity="0.5"/>
  <line x1="275" y1="195" x2="290" y2="230" stroke="#81C784" stroke-width="1.5" opacity="0.4"/>
  <line x1="240" y1="180" x2="270" y2="160" stroke="#C8E6C9" stroke-width="1.5" opacity="0.5"/>
</svg>
